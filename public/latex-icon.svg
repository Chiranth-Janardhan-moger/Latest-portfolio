<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="latexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="latexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#latexGrad)" filter="url(#latexGlow)"/>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="20" y1="30" x2="80" y2="30" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="20" y1="70" x2="80" y2="70" stroke="#818CF8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- LaTeX Symbol (L A T E X Typography) -->
  <!-- L -->
  <text x="22" y="60" font-family="serif" font-size="34" font-weight="bold" fill="#FFFFFF">L</text>
  <!-- A (smaller, raised) -->
  <text x="36" y="48" font-family="serif" font-size="22" font-weight="bold" fill="#A5B4FC">A</text>
  <!-- T -->
  <text x="50" y="60" font-family="serif" font-size="34" font-weight="bold" fill="#FFFFFF">T</text>
  <!-- E (lowered) -->
  <text x="64" y="66" font-family="serif" font-size="26" font-weight="bold" fill="#C7D2FE">E</text>
  <!-- X -->
  <text x="76" y="60" font-family="serif" font-size="34" font-weight="bold" fill="#FFFFFF">X</text>
  
  <!-- Native Tectonic Engine Dot Accent -->
  <circle cx="82" cy="74" r="3.5" fill="#38BDF8" />
</svg>
